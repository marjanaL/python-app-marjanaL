name: CI for Flask Product API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone the project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install the software (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download dependencies
        env:
          PIP_CMD: "pip"
          REQ_FILE: "requirements.txt"
        run: |
          $PIP_CMD install --only-binary :all: -r $REQ_FILE

      - name: Initialize DB
        run: python db.py -a

      - name: Run unit tests
        run: echo "No tests defined yet"

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0e0108be6eb6f6e57dfc61dfa29959f77f5a1cfb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          with:
          args: >
            -Dsonar.organization=marjanaL
            -Dsonar.projectKey=marjanaL_python-app-marjanaL
